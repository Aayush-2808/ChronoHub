{% extends "base.html" %}
{% block content %}
<div class="form-card"><h2>Login</h2>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post">
<label>Email</label><input type="email" name="email" required>
<label>Password</label>
<label>Password</label>
<div class="password-field">
    <input type="password" name="password" id="password" required>
    <button type="button" class="toggle-password" onclick="togglePassword()">
        <svg id="eyeIcon" viewBox="0 0 24 24">
            <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/>
            <circle cx="12" cy="12" r="3"/>
            <line id="eyeSlash" x1="4" y1="4" x2="20" y2="20" stroke="#333333" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
    </button>
</div>
<script>
function togglePassword() {
    const p = document.getElementById("password");
    const icon = document.getElementById("eyeIcon");
    const slash = document.getElementById("eyeSlash");

    p.type = p.type === "password" ? "text" : "password";
    slash.style.display = p.type === "text" ? "block" : "none";
}
</script>
<button type="submit">Login</button>
</form>
<p>New user? <a href="/register">Create an account</a></p>
</div>
{% endblock %}
